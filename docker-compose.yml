services:
  postgres:
    image: postgres:17-alpine
    container_name: buddy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: buddy
    ports:
      - "5432:5432"
    volumes:
      - buddy_pgdata:/var/lib/postgresql/data

volumes:
  buddy_pgdata:
